# Plain local Secrets replacing the base SealedSecrets. DATABASE_SCHEMA=treetracker
# (from base env) + the DB default search_path (treetracker, public) put treetracker-api's
# tables in the treetracker schema; public stays reachable for uuid_generate_v4/PostGIS.
apiVersion: v1
kind: Secret
metadata:
  name: database-connection
  namespace: treetracker-api
type: Opaque
stringData:
  db: postgresql://postgres:postgres@postgres.data.svc.cluster.local:5432/treetracker
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-connection
  namespace: treetracker-api
type: Opaque
stringData:
  messageQueue: amqp://guest:guest@rabbitmq.rabbitmq.svc.cluster.local:5672
